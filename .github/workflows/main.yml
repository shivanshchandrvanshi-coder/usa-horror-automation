
name: Horror Story Generator

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate horror story
        run: python main.py

      - name: Upload generated story
        uses: actions/upload-artifact@v4
        with:
          name: horror-story
          path: output/
          if-no-files-found: error

